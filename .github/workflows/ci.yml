name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  portfolio-regression:
    name: Portfolio regression path
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate ART example export
        run: npm run art:export -- --example

      - name: Run stable eval smoke suite
        run: npm run eval:career-agent -- --provider=mock-smoke --suite=ci-smoke
